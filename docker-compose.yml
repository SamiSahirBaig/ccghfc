version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 15 with PostGIS Spatial Extensions
  # ----------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:15-3.3
    container_name: cityclean-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cityclean
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cityclean"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis for Caching and BullMQ Job Scheduling
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cityclean-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # MinIO (S3-Compatible Object Storage)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: cityclean-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # Mailpit (Development SMTP Server and Webmail Viewer)
  # ----------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: cityclean-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1

  # ----------------------------------------------------------------------------
  # Backend Express REST API
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: cityclean-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cityclean?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: cityclean-media
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_FROM: '"CityClean Civic Redressal" <no-reply@cityclean.gov>'
      DM_OFFICE_EMAIL: dm-office@district.gov.in
      AI_PROVIDER: mock
      JWT_ACCESS_SECRET: cityclean_super_secret_access_jwt_key_2026_production
      JWT_REFRESH_SECRET: cityclean_super_secret_refresh_jwt_key_2026_production
      API_BASE_URL: http://localhost:5000
      WEB_BASE_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_started

  # ----------------------------------------------------------------------------
  # Frontend Next.js Web Application
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: cityclean-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  miniodata:
